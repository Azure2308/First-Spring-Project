<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заголовки запроса</title>
</head>
<body>
<h1>Заголовки запроса</h1>
<ul>
    <th:block th:each="entry : ${headers}">
        <li th:text="${entry.key + ': '} + ${entry.value}"></li>
    </th:block>
</ul>

</body>
</html>
